services:
  - type: web
    name: washington-house-finder
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: WHS_READ_ONLY
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.0
